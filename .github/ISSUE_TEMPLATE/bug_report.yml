name: Bug report
description: Report an installation or runtime issue.
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest request or command that shows the problem and the steps to run it.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, expected result and error. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: installation
    attributes:
      label: Installation
      description: Paste modal-aso doctor --json output. You may replace personal paths.
      render: json
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run modal-aso --version. For a development checkout, also include git rev-parse --short HEAD.
      placeholder: MODAL-ASO 1.0.0
    validations:
      required: true
